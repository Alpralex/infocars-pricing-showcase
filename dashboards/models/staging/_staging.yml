version: 2

models:
  - name: stg_raw_listings
    description: Raw synthetic ads, typed. Price and mileage are null when the ad left them empty.
    columns:
      - name: listing_id
        tests: [unique, not_null]
      - name: listed_date
        tests: [not_null]
      - name: source
        tests:
          - accepted_values: {values: ['portal_a', 'portal_b', 'portal_c']}
  - name: stg_listing_matches
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null
          - relationships: {to: ref('stg_raw_listings'), field: listing_id}
      - name: version_key
        tests:
          - relationships: {to: ref('catalog_versions'), field: version_key}
  - name: stg_listings_screened
    description: Every raw ad with the outcome of the quality checks (kept, bad_price, incomplete, price_outlier).
    columns:
      - name: listing_id
        tests: [unique, not_null]
      - name: quality_status
        tests:
          - not_null
          - accepted_values: {values: ['kept', 'bad_price', 'incomplete', 'price_outlier']}
      - name: days_on_market
        tests: [not_null]
