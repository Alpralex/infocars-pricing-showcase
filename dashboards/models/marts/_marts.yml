version: 2

models:
  - name: dim_version
    description: Canonical make, model and version (the catalogue), with display names.
    columns:
      - name: version_key
        tests: [unique, not_null]
      - name: body_type
        tests:
          - accepted_values: {values: ['Hatch', 'Sedan', 'SUV']}
  - name: dim_state
    columns:
      - name: state
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]
  - name: fct_listings
    description: One row per clean ad, with the market for the same version and model year (other ads only).
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null
          - relationships: {to: ref('stg_raw_listings'), field: listing_id}
      - name: version_key
        tests:
          - not_null
          - relationships: {to: ref('dim_version'), field: version_key}
      - name: state
        tests:
          - relationships: {to: ref('dim_state'), field: state}
      - name: listed_date
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_day}
      - name: removed_date
        tests:
          - relationships: {to: ref('dim_date'), field: date_day}
      - name: price_brl
        tests: [not_null]
      - name: days_on_market
        tests: [not_null]
      - name: price_position
        tests:
          - accepted_values: {values: ['above market', 'below market', 'within market range', 'too few comparables']}
      - name: price_band
        tests:
          - accepted_values: {values: ['Below -6%', '-6% to -2%', '-2% to +2%', '+2% to +6%', 'Above +6%', 'Too few comparables']}
  - name: mart_market_by_version
    description: Port of mv_market_by_version, per version, model year and state, ads last seen in the 180 days to the snapshot.
    tests:
      - unique_combination: {columns: [version_key, model_year, state]}
    columns:
      - name: listings
        tests: [not_null]
  - name: mart_price_position
    description: Days to sell and share still online by price band against comparable ads.
    columns:
      - name: price_band
        tests: [unique, not_null]
  - name: mart_stock_out_of_line
    description: Ads still online on the snapshot date priced above the 75th or below the 25th percentile of comparable ads.
    columns:
      - name: listing_id
        tests: [unique, not_null]
      - name: comparables
        tests: [not_null]
  - name: mart_data_quality
    description: The demo's data-quality report, one row per step.
    columns:
      - name: step_key
        tests: [unique, not_null]
      - name: ads
        tests: [not_null]
  - name: mart_km_depreciation
    description: Loss of asking price per 10,000 km per version, from a price-on-km fit inside each model year.
    columns:
      - name: version_key
        tests:
          - unique
          - not_null
          - relationships: {to: ref('dim_version'), field: version_key}
      - name: loss_per_10k_km_brl
        tests: [not_null]
  - name: mart_price_drivers
    description: Median gap to the comparable median per factor (mileage band, seller, gearbox, fuel, colour, photos) and level.
    tests:
      - unique_combination: {columns: [factor, level]}
    columns:
      - name: ads
        tests: [not_null]
      - name: factor
        tests:
          - accepted_values: {values: ['Mileage', 'Seller', 'Gearbox', 'Fuel', 'Colour', 'Photos']}
  - name: mart_buy_list
    description: Private-seller ads still online at or below the comparable median, classed Buy now, Negotiate or Wait, with the dealer's expected margin.
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null
          - relationships: {to: ref('fct_listings'), field: listing_id}
      - name: buy_class
        tests:
          - not_null
          - accepted_values: {values: ['Buy now', 'Negotiate', 'Wait']}
      - name: expected_margin_brl
        tests: [not_null]
  - name: mart_price_changes
    description: Every clean ad with a market, in two groups, with where the cut ads stood before and after the cut.
    columns:
      - name: listing_id
        tests: [unique, not_null]
      - name: cut_group
        tests:
          - accepted_values: {values: ['Cut the price', 'Never cut']}
  - name: mart_liquidity_curve
    description: Share of ads still online after 0 to 90 days, per model and for all models.
    tests:
      - unique_combination: {columns: [group_name, day]}
    columns:
      - name: still_online_share
        tests: [not_null]
  - name: mart_stock_risk
    description: Risk-of-getting-stuck score (0-100) per active ad with a market, with the points of each factor.
    columns:
      - name: listing_id
        tests: [unique, not_null]
      - name: risk_band
        tests:
          - accepted_values: {values: ['High', 'Medium', 'Low']}
